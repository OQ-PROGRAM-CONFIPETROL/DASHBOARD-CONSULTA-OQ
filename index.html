<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Consulta OQ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b2340;
  color:#fff;
  padding:20px;
}

.logoBox{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.logoBox img{
  max-width:260px;
  width:100%;
  background:#fff;
  padding:12px;
  border-radius:14px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:#fff;
  color:#111;
  border-radius:14px;
  padding:18px;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.card h2{
  font-size:15px;
  margin:0;
}

.valor{
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:25px;
}

.box{
  background:#fff;
  color:#111;
  border-radius:14px;
  padding:18px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-bottom:15px;
}

input,select{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  width:100%;
  box-sizing:border-box;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  color:#111;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:13px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#0b2340;
  color:#fff;
}

.badge{
  padding:4px 8px;
  border-radius:8px;
  font-weight:bold;
  display:inline-block;
}

.ACTIVO{
  background:#c8f7c5;
  color:#000;
}

.INACTIVO{
  background:#ffc7c7;
  color:#000;
}

.detalleCurso{
  background:#f4f7fb;
  padding:8px;
  border-radius:8px;
  margin:5px 0;
}

.detalleCurso a{
  font-weight:bold;
  color:#0b2340;
}

.tableWrap{
  overflow-x:auto;
}

canvas{
  width:100%!important;
  max-height:420px;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:1fr;
  }

  body{
    padding:10px;
  }

  th,td{
    font-size:11px;
    padding:6px;
  }

  .valor{
    font-size:26px;
  }

}

</style>
</head>

<body>

<div class="logoBox">
  <img src="logo.png" alt="CONFIPETROL">
</div>

<h1>DASHBOARD CONSULTA OQ</h1>

<div class="cards">

  <div class="card">
    <h2>Total personas</h2>
    <div class="valor" id="totalPersonas">0</div>
  </div>

  <div class="card">
    <h2>Con cursos</h2>
    <div class="valor" id="personasConCursos">0</div>
  </div>

  <div class="card">
    <h2>Sin cursos</h2>
    <div class="valor" id="personasSinCursos">0</div>
  </div>

  <div class="card">
    <h2>Total capacitaciones</h2>
    <div class="valor" id="totalCapacitaciones">0</div>
  </div>

</div>

<div class="grid">

  <div class="box">
    <h3>Top 10 cursos más cargados</h3>
    <canvas id="graficaCursos"></canvas>
  </div>

  <div class="box">
    <h3>Personas por cargo</h3>
    <canvas id="graficaCargos"></canvas>
  </div>

</div>

<div class="box">

  <h3>Consulta de personal y capacitaciones</h3>

  <div class="filters">

    <input
      id="buscar"
      placeholder="Buscar persona, documento, cargo o curso..."
      oninput="renderTabla()"
    >

    <select id="filtroCargo" onchange="renderTabla()">
      <option value="">Todos los cargos</option>
    </select>

    <select id="filtroEstacion" onchange="renderTabla()">
      <option value="">Todas las estaciones</option>
    </select>

    <select id="filtroEstado" onchange="renderTabla()">
      <option value="">Todos los estados</option>
      <option value="ACTIVO">ACTIVO</option>
      <option value="INACTIVO">INACTIVO</option>
    </select>

    <select id="filtroCurso" onchange="renderTabla()">
      <option value="">Todos los cursos</option>
    </select>

    <select id="filtroCursoModo" onchange="renderTabla()">
      <option value="TIENE">Tiene curso seleccionado</option>
      <option value="NO_TIENE">No tiene curso seleccionado</option>
    </select>

  </div>

  <div class="tableWrap">

    <table>

      <thead>
        <tr>
          <th>Nombre</th>
          <th>Documento</th>
          <th>Cargo</th>
          <th>Estación</th>
          <th>Estado</th>
          <th>Total cursos</th>
          <th>Capacitaciones / certificados</th>
        </tr>
      </thead>

      <tbody id="tabla"></tbody>

    </table>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxbzO1J8Dl0v4_NZ624FL9U7i4uIZzFhztAft7eyOWyQoGdR59VCxlpjUwrmgbIkZcKYA/exec";

let personasGlobal = [];
// Variables globales para almacenar y destruir las instancias de las gráficas
let chartCursos = null;
let chartCargos = null;

async function cargarDashboard(){

  try{

    console.log("Cargando dashboard...");

    const response = await fetch(API + "?dashboardConsulta=oq");

    const texto = await response.text();

    console.log(texto);

    const data = JSON.parse(texto);

    personasGlobal = data.personas || [];

    cargarFiltros(personasGlobal);

    // Ejecutamos renderTabla que a su vez actualizará las tarjetas e inicializará los gráficos
    renderTabla();

  }
  catch(error){

    console.error(error);

    alert("ERROR CARGANDO INFORMACIÓN");

  }

}

function cargarFiltros(personas){

  const cargos = [
    ...new Set(
      personas.map(p => p.cargo).filter(Boolean)
    )
  ].sort();

  const estaciones = [
    ...new Set(
      personas.map(p => p.estacion).filter(Boolean)
    )
  ].sort();

  const cursos = [
    ...new Set(
      personas.flatMap(p =>
        (p.cursos || []).map(c => c.curso)
      ).filter(Boolean)
    )
  ].sort();

  const filtroCargo =
    document.getElementById("filtroCargo");

  cargos.forEach(c => {

    const option =
      document.createElement("option");

    option.value = c;
    option.textContent = c;

    filtroCargo.appendChild(option);

  });

  const filtroEstacion =
    document.getElementById("filtroEstacion");

  estaciones.forEach(e => {

    const option =
      document.createElement("option");

    option.value = e;
    option.textContent = e;

    filtroEstacion.appendChild(option);

  });

  const filtroCurso =
    document.getElementById("filtroCurso");

  cursos.forEach(c => {

    const option =
      document.createElement("option");

    option.value = c;
    option.textContent = c;

    filtroCurso.appendChild(option);

  });

}

function renderTabla(){

  const buscar =
    document.getElementById("buscar")
    .value
    .toLowerCase()
    .trim();

  const cargo =
    document.getElementById("filtroCargo").value;

  const estacion =
    document.getElementById("filtroEstacion").value;

  const estado =
    document.getElementById("filtroEstado").value;

  const cursoFiltro =
    document.getElementById("filtroCurso").value;

  const cursoModo =
    document.getElementById("filtroCursoModo").value;

  const tbody =
    document.getElementById("tabla");

  tbody.innerHTML = "";

  const filtrados = personasGlobal.filter(p => {

    const cursos = p.cursos || [];

    const cursosTexto =
      cursos.map(c => c.curso || "")
      .join(" ")
      .toLowerCase();

    const textoBusqueda = `
      ${p.nombre || ""}
      ${p.documento || ""}
      ${p.cargo || ""}
      ${p.estacion || ""}
      ${cursosTexto}
    `.toLowerCase();

  const tieneCurso =
      cursoFiltro
        ? cursos.some(c =>
            (c.curso || "").trim().toUpperCase() ===
            cursoFiltro.trim().toUpperCase()
          )
        : true;

    let filtroCursoFinal = true;

    if(cursoFiltro){

      if(cursoModo === "TIENE"){
        filtroCursoFinal = tieneCurso;
      }

      if(cursoModo === "NO_TIENE"){
        filtroCursoFinal = !tieneCurso;
      }

    }

    return(

      (!buscar || textoBusqueda.includes(buscar)) &&
      (!cargo || p.cargo === cargo) &&
      (!estacion || p.estacion === estacion) &&
      (!estado || p.estado === estado) &&
      filtroCursoFinal

    );

  });

  // ========================================================
  // RECALCULAR CONTADORES DE TARJETAS BASADO EN FILTRADOS
  // ========================================================
  let conCursosCount = 0;
  let sinCursosCount = 0;
  let totalCapacitacionesCount = 0;

  filtrados.forEach(p => {
    const totalCursos = (p.cursos || []).length;
    totalCapacitacionesCount += totalCursos;
    if (totalCursos > 0) {
      conCursosCount++;
    } else {
      sinCursosCount++;
    }
  });

  document.getElementById("totalPersonas").textContent = filtrados.length;
  document.getElementById("personasConCursos").textContent = conCursosCount;
  document.getElementById("personasSinCursos").textContent = sinCursosCount;
  document.getElementById("totalCapacitaciones").textContent = totalCapacitacionesCount;

  // ========================================================
  // DIBUJAR LA TABLA EN EL HTML
  // ========================================================
  filtrados.forEach(p => {

    const cursos = p.cursos || [];

    const cursosHTML = cursos.length

      ? cursos.map(c => {

          return `
            <div class="detalleCurso">

              <strong>${c.curso || "Sin nombre"}</strong><br>

              Fecha:
              ${formatearFecha(c.fecha)}<br>

              ${
                c.certificado
                ? `<a href="${c.certificado}" target="_blank">Ver certificado</a>`
                : "Sin certificado"
              }

            </div>
          `;

        }).join("")

      : "Sin capacitaciones";

    const estadoTexto =
      p.estado || "SIN ESTADO";

    const claseEstado =
      estadoTexto === "ACTIVO"
      ? "ACTIVO"
      : "INACTIVO";

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>${p.nombre || "—"}</td>

      <td>${p.documento || "—"}</td>

      <td>${p.cargo || "—"}</td>

      <td>${p.estacion || "—"}</td>

      <td>
        <span class="badge ${claseEstado}">
          ${estadoTexto}
        </span>
      </td>

      <td>${cursos.length}</td>

      <td>${cursosHTML}</td>

    `;

    tbody.appendChild(tr);

  });

  // Actualizar las métricas de las gráficas según la información filtrada
  actualizarGraficasDinamicas(filtrados);
}

function formatearFecha(fecha){

  if(!fecha){
    return "Sin fecha";
  }

  return fecha;

}

function actualizarGraficasDinamicas(datosFiltrados){

  // 1. Procesar datos para cursos filtrados
  const cursosMap = {};
  datosFiltrados.forEach(p => {
    (p.cursos || []).forEach(c => {
      if (c.curso) {
        cursosMap[c.curso] = (cursosMap[c.curso] || 0) + 1;
      }
    });
  });
  const topCursosFiltrados = Object.keys(cursosMap)
    .map(c => ({ curso: c, total: cursosMap[c] }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);

  // 2. Procesar datos para cargos filtrados
  const cargosMap = {};
  datosFiltrados.forEach(p => {
    if (p.cargo) {
      cargosMap[p.cargo] = (cargosMap[p.cargo] || 0) + 1;
    }
  });
  const cargosFiltrados = Object.keys(cargosMap)
    .map(c => ({ cargo: c, total: cargosMap[c] }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);

  // ==========================================
  // GRÁFICA 1: TOP CURSOS
  // ==========================================
  if (chartCursos) {
    chartCursos.destroy(); // Destruye la gráfica anterior si existe
  }

  chartCursos = new Chart(
    document.getElementById("graficaCursos"),
    {
      type:"bar",
      data:{
        labels: topCursosFiltrados.map(x => cortarTexto(x.curso,25)),
        datasets:[{
          label:"Cantidad",
          data: topCursosFiltrados.map(x => x.total),
          backgroundColor: '#0b2340',
          borderColor: '#08172b',
          borderWidth: 1
        }]
      },
      options:{
        indexAxis:"y",
        responsive:true,
        plugins:{
          legend:{display:false}
        }
      }
    }
  );

  // ==========================================
  // GRÁFICA 2: PERSONAS POR CARGO
  // ==========================================
  if (chartCargos) {
    chartCargos.destroy(); // Destruye la gráfica anterior si existe
  }

  chartCargos = new Chart(
    document.getElementById("graficaCargos"),
    {
      type:"bar",
      data:{
        labels: cargosFiltrados.map(x => cortarTexto(x.cargo,22)),
        datasets:[{
          label:"Personas",
          data: cargosFiltrados.map(x => x.total),
          backgroundColor: '#f29100', // Un tono naranja/amarillo complementario
          borderColor: '#c67700',
          borderWidth: 1
        }]
      },
      options:{
        indexAxis:"y",
        responsive:true,
        plugins:{
          legend:{display:false}
        }
      }
    }
  );

}

function cortarTexto(txt,max){

  return txt && txt.length > max
    ? txt.substring(0,max) + "..."
    : txt;

}

// Inicialización de la carga de datos
cargarDashboard();

</script>

</body>
</html>
